<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plicet Games - PLICET PUZZLE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0F172A 0%, #0A101D 50%, #070B14 100%);
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 24px;
            padding: 40px 32px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }
        .logo {
            font-size: 56px;
            margin-bottom: 12px;
        }
        h1 {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(180deg, #FFEB3B 0%, #FF8F00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }
        .subtitle {
            color: #38BDF8;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        p {
            color: #CBD5E1;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .btn-play {
            display: inline-block;
            background: linear-gradient(180deg, #22C55E 0%, #16A34A 100%);
            color: #FFFFFF;
            font-weight: 800;
            font-size: 16px;
            padding: 14px 28px;
            border-radius: 12px;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
            transition: transform 0.2s;
        }
        .btn-play:hover {
            transform: scale(1.04);
        }
        .footer {
            margin-top: 32px;
            font-size: 12px;
            color: #64748B;
        }
        .footer a {
            color: #38BDF8;
            text-decoration: none;
            margin: 0 8px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🧩</div>
        <h1>PLICET PUZZLE</h1>
        <div class="subtitle">BLOCK PUZZLE GAME</div>
        <p>¡Disfruta del juego casual de rompecabezas de bloques más vibrante, estratégico y relajante para Android!</p>
        <a class="btn-play" href="https://play.google.com/store/apps/details?id=com.plicet.puzzle" target="_blank">
            ▶ Ver en Google Play
        </a>
        <div class="footer">
            <p>© 2026 Plicet Games. Todos los derechos reservados.</p>
            <p>
                <a href="https://plicetad.github.io/app-ads.txt">app-ads.txt</a> |
                <a href="https://play.google.com/store/apps/details?id=com.plicet.puzzle">Google Play Store</a>
            </p>
        </div>
    </div>
</body>
</html>
